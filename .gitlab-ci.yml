stages:
  - build

build:
  stage: build

  image: docker:latest

  services:
    - docker:dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

  script:
    - docker build -t registry.gitlab.com/sts-loandocx-backend-group/loandocx-backend:development .
    - docker push registry.gitlab.com/sts-loandocx-backend-group/loandocx-backend:development

  only:
    - development